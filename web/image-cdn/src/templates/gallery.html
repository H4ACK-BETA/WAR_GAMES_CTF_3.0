<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image CDN - Gallery</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f23; color: #ccc; min-height: 100vh; }
        nav { background: #1a1a2e; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        nav a { color: #e94560; text-decoration: none; margin: 0 15px; }
        nav a:hover { color: #fff; }
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #e94560; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .card { background: #1a1a2e; border-radius: 8px; overflow: hidden; }
        .card img { width: 100%; height: 180px; object-fit: cover; }
        .card .info { padding: 10px; font-size: 0.8em; color: #666; }
        .card a { color: #e94560; text-decoration: none; }
        .empty { color: #555; text-align: center; padding: 60px; }
    </style>
</head>
<body>
    <nav>
        <span style="color:#fff; font-weight:bold;">📷 Image CDN</span>
        <div>
            <a href="/">Upload</a>
            <a href="/gallery">Gallery</a>
            <a href="/admin">Admin</a>
        </div>
    </nav>
    <div class="container">
        <h1>Processed Images</h1>
        {% if images %}
        <div class="grid">
            {% for img in images %}
            <div class="card">
                <img src="/cdn/{{ img }}" alt="{{ img }}">
                <div class="info">
                    <a href="/cdn/{{ img }}">{{ img }}</a>
                </div>
            </div>
            {% endfor %}
        </div>
        {% else %}
        <div class="empty">
            <p>No images yet. <a href="/" style="color:#e94560;">Upload one!</a></p>
        </div>
        {% endif %}
    </div>
</body>
</html>
