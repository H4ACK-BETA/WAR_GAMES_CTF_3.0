<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image CDN - Admin Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f23; color: #ccc;
               min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-box { background: #1a1a2e; padding: 40px; border-radius: 12px; width: 350px; }
        h2 { color: #e94560; margin-bottom: 25px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 8px 0; background: #16213e;
                border: 1px solid #333; border-radius: 6px; color: #fff; font-size: 1em; }
        input:focus { outline: none; border-color: #e94560; }
        button { width: 100%; padding: 12px; margin-top: 15px; background: #e94560;
                 color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 1em; }
        button:hover { background: #c23050; }
        .flash { padding: 10px; border-radius: 6px; margin-bottom: 15px;
                 background: #4a1525; color: #e94560; text-align: center; font-size: 0.9em; }
        .back { display: block; text-align: center; margin-top: 20px; color: #555; text-decoration: none; }
        .back:hover { color: #e94560; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>🔒 Admin Panel</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="flash">{{ message }}</div>
        {% endfor %}
        {% endwith %}
        <form method="POST" action="/admin">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <a href="/" class="back">← Back to CDN</a>
    </div>
</body>
</html>
