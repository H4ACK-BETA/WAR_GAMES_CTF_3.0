<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaCorp - Internal Status</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Courier New', monospace; background: #0a0e17; color: #8892b0; min-height: 100vh; }
        .header { background: #112240; padding: 20px 30px; border-bottom: 1px solid #1d3461; }
        .header h1 { color: #64ffda; font-size: 1.2em; }
        .header span { color: #495670; font-size: 0.8em; }
        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .card { background: #112240; border: 1px solid #1d3461; border-radius: 8px; padding: 25px; margin: 20px 0; }
        .card h3 { color: #ccd6f6; margin-bottom: 15px; }
        input, textarea { width: 100%; padding: 10px; margin: 8px 0; background: #0a192f;
                          border: 1px solid #1d3461; border-radius: 4px; color: #ccd6f6; font-family: monospace; }
        input:focus, textarea:focus { outline: none; border-color: #64ffda; }
        button { padding: 10px 20px; background: #64ffda; color: #0a192f; border: none;
                 border-radius: 4px; cursor: pointer; font-weight: bold; font-family: monospace; }
        button:hover { background: #4cd9b0; }
        .endpoints { color: #495670; font-size: 0.85em; margin-top: 20px; }
        .endpoints a { color: #64ffda; text-decoration: none; }
        .result { background: #0a192f; border: 1px solid #1d3461; border-radius: 4px;
                  padding: 15px; margin-top: 15px; white-space: pre-wrap; font-size: 0.85em;
                  max-height: 400px; overflow-y: auto; display: none; }
    </style>
</head>
<body>
    <div class="header">
        <h1>NovaCorp Internal Status Monitor</h1>
        <span>frontend-7b9d4f8c6-x2k4m | production | v2.1.3</span>
    </div>
    <div class="container">
        <div class="card">
            <h3>URL Health Checker</h3>
            <p style="color:#495670; margin-bottom:10px;">Check availability of internal services.</p>
            <form id="fetchForm">
                <input type="text" id="urlInput" placeholder="http://service.production.svc:port/path" />
                <button type="submit">Fetch</button>
            </form>
            <div id="result" class="result"></div>
        </div>
        <div class="endpoints">
            <p>Internal Endpoints:</p>
            <p><a href="/status">/status</a> — Service health</p>
            <p><a href="/debug/env">/debug/env</a> — Pod environment</p>
            <p><a href="/debug/logs?path=app.log">/debug/logs</a> — Application logs</p>
        </div>
    </div>
    <script>
        document.getElementById('fetchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const url = document.getElementById('urlInput').value;
            const res = document.getElementById('result');
            res.style.display = 'block';
            res.textContent = 'Fetching...';
            try {
                const resp = await fetch('/fetch', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({url: url})
                });
                const data = await resp.json();
                res.textContent = JSON.stringify(data, null, 2);
            } catch(err) {
                res.textContent = 'Error: ' + err.message;
            }
        });
    </script>
</body>
</html>
